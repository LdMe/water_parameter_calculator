version: '3'
services:
  mongo:
    image: mongo
    container_name: mongo-color
    restart: always
    volumes:
      - ./data:/data/db
  server:
    build: ./server
    container_name: server-color
    restart: always
    ports:
      - "3011:3000"
    depends_on:
      - mongo
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules

  client:
    image: nginx
    container_name: client-color
    restart: always
    depends_on:
      - server
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro


